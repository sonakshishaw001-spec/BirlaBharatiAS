<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ForgeLoop — Build Monitor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#fbfbfa; --surface:#ffffff; --ink:#1c2321; --muted:#5b6660;
    --line:#e3e6e3; --accent:#1f6f5c; --danger:#b3432b; --warn:#b8860b; --accent-ink:#fff;
    --radius:8px; --max:1200px;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:"DM Sans",system-ui,Arial,sans-serif;background:var(--bg);color:var(--ink);}
  .wrap{max-width:var(--max);margin:0 auto;padding:0 20px;}
  header{background:var(--surface);border-bottom:1px solid var(--line);}
  .bar{display:flex;align-items:center;justify-content:space-between;min-height:64px;gap:12px;flex-wrap:wrap;}
  .logo{font-weight:700;text-decoration:none;color:var(--ink);}
  input[type=text]{font:inherit;padding:10px 14px;border:1px solid var(--line);border-radius:var(--radius);width:320px;max-width:60vw;}
  .btn{display:inline-block;padding:10px 18px;border-radius:var(--radius);font-weight:500;
       text-decoration:none;cursor:pointer;border:2px solid var(--accent);background:var(--accent);color:#fff;font:inherit;}
  .btn.secondary{background:transparent;color:var(--accent);}

  main{padding:32px 0 64px;}
  .grid{display:grid;grid-template-columns:1.3fr 1fr;gap:20px;}
  @media (max-width:800px){.grid{grid-template-columns:1fr;}}

  .panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:20px;margin-bottom:20px;}
  .panel h2{margin:0 0 4px;font-size:1.1rem;}
  .panel .sub{color:var(--muted);font-size:0.9rem;margin-bottom:16px;}

  /* Game preview area, swap for a real <canvas> once the generator runs */
  .stage{height:280px;border:1px dashed var(--line);border-radius:var(--radius);
         display:flex;align-items:center;justify-content:center;background:#0f1713;color:#7fd9b8;
         font-size:0.95rem;text-align:center;padding:16px;}

  /* Pipeline steps */
  .pipeline{display:flex;flex-direction:column;gap:0;}
  .step{display:flex;gap:14px;padding:14px 0;border-bottom:1px solid var(--line);align-items:flex-start;}
  .step:last-child{border-bottom:none;}
  .dot{flex:none;width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;
       font-size:0.85rem;font-weight:700;color:#fff;background:var(--line);color:var(--muted);}
  .step.done .dot{background:var(--accent);color:#fff;}
  .step.active .dot{background:var(--warn);color:#fff;}
  .step.error .dot{background:var(--danger);color:#fff;}
  .step h3{margin:0 0 2px;font-size:0.98rem;}
  .step p{margin:0;color:var(--muted);font-size:0.88rem;}
  .step .tag{font-size:0.75rem;font-weight:600;padding:2px 8px;border-radius:99px;margin-left:8px;}
  .tag.done{background:#e4f1ec;color:var(--accent);}
  .tag.active{background:#fbf1de;color:var(--warn);}
  .tag.error{background:#f7e6e1;color:var(--danger);}

  /* Log console */
  .log{background:#0f1713;color:#c8f0dd;border-radius:var(--radius);padding:14px 16px;
       font-family:ui-monospace,Consolas,monospace;font-size:0.82rem;height:220px;overflow-y:auto;}
  .log .err{color:#ff9a80;}
  .log .fix{color:#7fd9b8;}

  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px;}
  .stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px;}
  .stat .num{font-size:1.5rem;font-weight:700;}
  .stat .label{color:var(--muted);font-size:0.82rem;}
</style>
</head>
<body>

<header>
  <div class="wrap bar">
    <a class="logo" href="index.html">ForgeLoop</a>
    <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;">
      <input type="text" id="promptInput" placeholder="e.g. a platformer where you collect coins">
      <button class="btn" id="runBtn" type="button">Generate &amp; run</button>
    </div>
  </div>
</header>

<main class="wrap">
  <div class="stats" id="stats" style="margin-bottom:20px;"></div>

  <div class="grid">
    <div>
      <div class="panel">
        <h2>Game preview</h2>
        <div class="sub">What the generated game currently looks like.</div>
        <div class="stage" id="stage">Type a prompt above and click "Generate &amp; run" to start the loop.</div>
      </div>

      <div class="panel">
        <h2>Live log</h2>
        <div class="sub">Raw output from generation, playtesting and self-healing.</div>
        <div class="log" id="log"></div>
      </div>
    </div>

    <div class="panel">
      <h2>Build-test-fix pipeline</h2>
      <div class="sub">Each stage runs automatically, no human step in between.</div>
      <div class="pipeline" id="pipeline"></div>
    </div>
  </div>
</main>

<script>
  // ---- EDIT THIS: point at your teammate's real backend once it exists ----
  // Expected: POST { prompt } -> streams or returns a sequence of events like:
  // { stage: "codegen"|"playtest"|"heal", status: "active"|"done"|"error", message: "...", attempt: 1 }
  const API_URL = "http://127.0.0.1:5000/api/generate";

  const STAGES = [
    { key: "codegen", title: "Code generation",  desc: "Writing the game from your prompt." },
    { key: "playtest", title: "Automated playtest", desc: "A bot plays the game to verify movement, collisions and win/loss states." },
    { key: "heal",     title: "Self-healing",     desc: "Diagnosing and patching any failure found during playtest." },
    { key: "verify",   title: "Re-verify",        desc: "Re-running the playtest to confirm the fix worked." }
  ];

  const pipelineEl = document.getElementById("pipeline");
  const logEl = document.getElementById("log");
  const stageEl = document.getElementById("stage");
  const statsEl = document.getElementById("stats");

  function renderPipeline(states) {
    pipelineEl.innerHTML = STAGES.map(s => {
      const st = states[s.key] || "pending";
      const dotLabel = st === "done" ? "✓" : st === "error" ? "!" : st === "active" ? "…" : "";
      return `
        <div class="step ${st}">
          <div class="dot">${dotLabel}</div>
          <div>
            <h3>${s.title} ${st !== "pending" ? `<span class="tag ${st}">${st}</span>` : ""}</h3>
            <p>${s.desc}</p>
          </div>
        </div>`;
    }).join("");
  }

  function log(line, cls) {
    const div = document.createElement("div");
    if (cls) div.className = cls;
    div.textContent = line;
    logEl.appendChild(div);
    logEl.scrollTop = logEl.scrollHeight;
  }

  function renderStats(stats) {
    statsEl.innerHTML = `
      <div class="stat"><div class="num">${stats.attempts}</div><div class="label">Fix attempts</div></div>
      <div class="stat"><div class="num">${stats.bugsFound}</div><div class="label">Bugs found</div></div>
      <div class="stat"><div class="num">${stats.bugsFixed}</div><div class="label">Bugs auto-fixed</div></div>
      <div class="stat"><div class="num">${stats.elapsed}s</div><div class="label">Time elapsed</div></div>`;
  }

  // ---- Sample scripted run, used until the real backend streams real events ----
  // Swap runSample() for a real fetch()/EventSource() call to API_URL when ready.
  async function runSample(prompt) {
    const states = {};
    const stats = { attempts: 0, bugsFound: 0, bugsFixed: 0, elapsed: 0 };
    const start = Date.now();
    const tick = () => { stats.elapsed = Math.round((Date.now()-start)/1000); renderStats(stats); };
    const wait = ms => new Promise(r => setTimeout(r, ms));

    logEl.innerHTML = "";
    stageEl.textContent = "Generating game from: \"" + prompt + "\"";
    renderPipeline(states); renderStats(stats);

    log("> Prompt received: " + prompt);
    states.codegen = "active"; renderPipeline(states);
    await wait(1200); log("[codegen] writing player movement, collisions, scoring...");
    await wait(1000); states.codegen = "done"; renderPipeline(states);
    log("[codegen] done, 142 lines generated");

    states.playtest = "active"; renderPipeline(states); tick();
    await wait(1200); log("[playtest] launching automated playtest bot...");
    await wait(1200);
    stats.bugsFound = 1; renderStats(stats);
    states.playtest = "error"; renderPipeline(states);
    log("[playtest] FAILED: player falls through platform collider", "err");

    states.heal = "active"; renderPipeline(states); tick();
    await wait(1000); log("[heal] diagnosing failure: collision boundary offset by 4px");
    await wait(1200); log("[heal] patching collision detection logic...");
    stats.attempts = 1; renderStats(stats);
    await wait(800); states.heal = "done"; renderPipeline(states);

    states.verify = "active"; renderPipeline(states); tick();
    await wait(1200); log("[verify] re-running playtest bot...");
    await wait(1200);
    stats.bugsFixed = 1; renderStats(stats);
    states.verify = "done"; renderPipeline(states);
    log("[verify] PASSED: movement, collisions and win state all confirmed", "fix");
    stageEl.textContent = "✓ Game verified playable: \"" + prompt + "\"";
    tick();
  }

  document.getElementById("runBtn").addEventListener("click", () => {
    const prompt = document.getElementById("promptInput").value.trim() || "a platformer where you collect coins and avoid spikes";
    runSample(prompt);
  });
</script>
</body>
</html>
